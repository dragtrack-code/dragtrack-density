[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragtrack"
version = "0.6.10"
description = "Atmospheric density rho(t, lat, lon, alt) from DragTrack JSON data products."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Daniel J. Gershman", email = "daniel.j.gershman@nasa.gov" },
]
keywords = [
    "atmosphere",
    "thermosphere",
    "density",
    "drag",
    "satellite",
    "jacchia",
    "spherical-harmonics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
test  = ["pytest>=7", "sgp4>=2.20"]
dev   = ["pytest>=7", "sgp4>=2.20", "pytest-cov"]

[project.scripts]
dragtrack = "dragtrack.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dragtrack*"]
exclude = ["tests*", ".claude*"]

[tool.setuptools.package-data]
dragtrack = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
